<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}ForteHire{% endblock %}</title>
  <script>
    (function () {
      const saved = localStorage.getItem("fortehire-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (saved === "dark" || (!saved && prefersDark)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="mobile-header">
    <button type="button" class="menu-btn" aria-label="Open menu" onclick="toggleSidebar()">☰ Menu</button>
    <span class="mobile-brand">ForteHire</span>
    <button type="button" class="theme-toggle-mini" aria-label="Toggle theme" onclick="toggleTheme()">☾</button>
  </header>

  <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div>
          <div class="brand">ForteHire</div>
          <div class="brand-sub">Workflow Optimisation</div>
        </div>
        <button type="button" class="close-btn" aria-label="Close menu" onclick="closeSidebar()">✕</button>
      </div>
      <nav class="nav">
        <a href="/" class="{{ 'active' if request.path == '/' }}">Dashboard</a>
        <a href="/queue" class="{{ 'active' if request.path.startswith('/queue') }}">Action Queue</a>
        <a href="/pipeline" class="{{ 'active' if request.path.startswith('/pipeline') }}">Pipeline</a>
        <a href="/candidates" class="{{ 'active' if request.path.startswith('/candidates') }}">Candidates</a>
        <a href="/jobs" class="{{ 'active' if request.path.startswith('/jobs') }}">Jobs</a>
        <a href="/analytics" class="{{ 'active' if request.path.startswith('/analytics') }}">Analytics</a>
      </nav>
      <button type="button" id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">
        Dark Mode
      </button>
    </aside>

    <div class="main-wrap">
      <main class="content">
        {% block content %}{% endblock %}
      </main>
      <footer class="footer">
        Synthetic demo data · ForteHire prioritises workflow actions, not candidates.
      </footer>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
